name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Resources/Info.plist

      - name: Build universal app
        run: UNIVERSAL=1 ./build.sh

      - name: Zip
        run: ditto -c -k --keepParent build/ScreenBuddy.app build/ScreenBuddy.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ScreenBuddy
          path: build/ScreenBuddy.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ScreenBuddy

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ScreenBuddy.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "ScreenBuddy $GITHUB_REF_NAME" \
            --generate-notes
